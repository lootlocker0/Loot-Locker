        .scan-line {

            width: 100%;
            height: 2px;

        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffd65b;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        .glimmer {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 25%, rgba(255,255,255,0.1) 50%, transparent 75%);
            background-size: 200% 200%;
            animation: glimmer-move 3s linear infinite;
            pointer-events: none;
        }

        @keyframes glimmer-move {
            0% { background-position: -200% -200%; }
            100% { background-position: 200% 200%; }
        }
    </style>

<script>
        // Particle/Confetti Effect
        const container = document.getElementById('confetti-layer');
        const colors = ['#ffd65b', '#ddb7ff', '#a7c8ff', '#ffffff'];

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            // Random properties
            const size = Math.random() * 8 + 4;
            const left = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 5;
            const color = colors[Math.floor(Math.random() * colors.length)];

            confetti.style.width = `${size}px`;
            confetti.style.height = `${size}px`;
            confetti.style.left = `${left}vw`;
            confetti.style.top = `-20px`;
            confetti.style.backgroundColor = color;
            confetti.style.animationDuration = `${duration}s`;
            confetti.style.animationDelay = `${delay}s`;
            confetti.style.opacity = Math.random();
            confetti.style.clipPath = Math.random() > 0.5 ? 'polygon(50% 0%, 0% 100%, 100% 100%)' : 'none';

            container.appendChild(confetti);

            // Cleanup
            setTimeout(() => {
                confetti.remove();
            }, (duration + delay) * 1000);
        }

        // Initialize confetti
        for(let i = 0; i < 50; i++) {
            createConfetti();
        }

        // Keep producing
        setInterval(createConfetti, 150);

        // Micro-interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.classList.add('scale-95');
            });
            btn.addEventListener('mouseup', () => {
                btn.classList.remove('scale-95');
            });
        });
    </script>
